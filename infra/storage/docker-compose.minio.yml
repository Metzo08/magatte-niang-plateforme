services:
  minio:
    image: minio/minio:RELEASE.2025-02-07T23-21-09Z
    container_name: magatte-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-magatte_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Definir MINIO_ROOT_PASSWORD dans .env}
      MINIO_BROWSER_REDIRECT_URL: ${MINIO_CONSOLE_URL:-http://localhost:9001}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 10s
      retries: 3

  minio-init:
    image: minio/mc:latest
    container_name: magatte-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-magatte_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Definir MINIO_ROOT_PASSWORD dans .env}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
      mc mb -p local/magatte-media || true;
      mc mb -p local/magatte-backups || true;
      mc anonymous set download local/magatte-media;
      mc anonymous set none local/magatte-backups;
      echo 'Buckets MinIO magatte-media (public) et magatte-backups (prive) prets.';
      "

  postgres-backup:
    image: postgres:16-alpine
    container_name: magatte-pg-backup
    restart: unless-stopped
    depends_on:
      minio:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:?Definir DATABASE_URL dans .env}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-magatte_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Definir MINIO_ROOT_PASSWORD dans .env}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
    volumes:
      - ./backup-postgres.sh:/usr/local/bin/backup-postgres.sh:ro
    entrypoint: >
      /bin/sh -c "
      apk add --no-cache curl &&
      curl -fsSL https://dl.min.io/client/mc/release/linux-amd64/mc -o /usr/local/bin/mc &&
      chmod +x /usr/local/bin/mc /usr/local/bin/backup-postgres.sh &&
      while true; do
        /usr/local/bin/backup-postgres.sh || echo 'Erreur sauvegarde PostgreSQL';
        sleep 86400;
      done
      "

volumes:
  minio_data:
