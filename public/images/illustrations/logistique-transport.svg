<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="logBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B1B2B"/>
      <stop offset="55%" stop-color="#132C42"/>
      <stop offset="100%" stop-color="#060E18"/>
    </linearGradient>
    <linearGradient id="cabColor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F9B685"/>
      <stop offset="55%" stop-color="#F26A1B"/>
      <stop offset="100%" stop-color="#A8430A"/>
    </linearGradient>
    <linearGradient id="skipFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2D6A8E"/>
      <stop offset="100%" stop-color="#1B4965"/>
    </linearGradient>
    <radialGradient id="headlight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F9B685" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#F9B685" stop-opacity="0"/>
    </radialGradient>
    <pattern id="roadLine" width="90" height="14" patternUnits="userSpaceOnUse">
      <rect width="46" height="14" fill="#D9C285" opacity="0.55"/>
    </pattern>
    <pattern id="cargoHatch" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M0 16L16 0" stroke="#0B1B2B" stroke-width="2" opacity="0.5"/>
    </pattern>
  </defs>

  <rect width="1200" height="800" fill="url(#logBg)"/>

  <!-- Lune -->
  <circle cx="1020" cy="130" r="52" fill="#E4EEF6" opacity="0.9"/>
  <circle cx="1002" cy="118" r="10" fill="#C5DCEA" opacity="0.7"/>
  <circle cx="1035" cy="145" r="7" fill="#C5DCEA" opacity="0.6"/>
  <circle cx="1010" cy="152" r="5" fill="#C5DCEA" opacity="0.5"/>

  <!-- Étoiles -->
  <g fill="#9FC1D9">
    <circle cx="120" cy="90" r="1.6" opacity="0.8"/>
    <circle cx="260" cy="150" r="1.3" opacity="0.6"/>
    <circle cx="420" cy="70" r="1.8" opacity="0.85"/>
    <circle cx="560" cy="130" r="1.3" opacity="0.6"/>
    <circle cx="700" cy="90" r="1.5" opacity="0.75"/>
    <circle cx="840" cy="60" r="1.4" opacity="0.7"/>
    <circle cx="180" cy="210" r="1.2" opacity="0.5"/>
    <circle cx="640" cy="190" r="1.2" opacity="0.5"/>
  </g>

  <!-- Silhouette entrepôt en arrière-plan -->
  <g fill="#0F2436">
    <rect x="40" y="330" width="380" height="180"/>
    <path d="M40 330 L230 260 L420 330 Z" fill="#132C42"/>
    <rect x="470" y="360" width="240" height="150"/>
    <path d="M470 360 L590 310 L710 360 Z" fill="#132C42"/>
  </g>
  <g fill="#F9B685" opacity="0.5">
    <rect x="90" y="380" width="34" height="26"/>
    <rect x="160" y="380" width="34" height="26"/>
    <rect x="300" y="380" width="34" height="26"/>
    <rect x="530" y="400" width="30" height="24"/>
    <rect x="620" y="400" width="30" height="24"/>
  </g>

  <!-- Route -->
  <rect x="0" y="620" width="1200" height="180" fill="#0A1622"/>
  <rect x="0" y="690" width="1200" height="14" fill="url(#roadLine)"/>
  <line x1="0" y1="620" x2="1200" y2="620" stroke="#5FA8D3" stroke-width="2" opacity="0.25"/>

  <!-- Camion 8x4 benne -->
  <g>
    <!-- Remorque / benne -->
    <rect x="120" y="330" width="560" height="200" rx="10" fill="url(#skipFill)" stroke="#5FA8D3" stroke-width="3"/>
    <rect x="120" y="330" width="560" height="200" rx="10" fill="url(#cargoHatch)" opacity="0.4"/>
    <rect x="140" y="350" width="520" height="60" rx="6" fill="#0B1B2B" opacity="0.55"/>
    <text x="200" y="392" fill="#9FC1D9" font-family="monospace" font-size="30" font-weight="bold">SB-S LOGISTIK</text>
    <rect x="140" y="430" width="180" height="10" fill="#F26A1B" opacity="0.8"/>
    <rect x="140" y="452" width="120" height="8" fill="#9FC1D9" opacity="0.4"/>

    <!-- Châssis -->
    <rect x="100" y="530" width="640" height="26" fill="#0A1622"/>

    <!-- Cabine -->
    <rect x="680" y="300" width="230" height="230" rx="16" fill="url(#cabColor)"/>
    <rect x="706" y="330" width="150" height="90" rx="8" fill="#0B1B2B"/>
    <rect x="712" y="336" width="62" height="78" rx="5" fill="#5FA8D3" opacity="0.45"/>
    <rect x="784" y="336" width="62" height="78" rx="5" fill="#5FA8D3" opacity="0.3"/>
    <rect x="680" y="470" width="230" height="60" fill="#A8430A"/>
    <rect x="700" y="486" width="90" height="26" rx="4" fill="#0B1B2B" opacity="0.6"/>
    <text x="712" y="505" fill="#F9B685" font-family="monospace" font-size="16">8x4</text>
    <!-- Échappement -->
    <rect x="880" y="270" width="14" height="60" fill="#0A1622"/>
    <!-- Phares -->
    <circle cx="900" cy="500" r="26" fill="url(#headlight)"/>
    <circle cx="900" cy="500" r="9" fill="#F9B685"/>
    <!-- Pare-chocs -->
    <rect x="680" y="530" width="250" height="20" rx="6" fill="#132C42"/>

    <!-- Roues -->
    <g>
      <circle cx="220" cy="570" r="52" fill="#04090F" stroke="#55636F" stroke-width="6"/>
      <circle cx="220" cy="570" r="24" fill="#132C42" stroke="#8A9199" stroke-width="4"/>
      <circle cx="340" cy="570" r="52" fill="#04090F" stroke="#55636F" stroke-width="6"/>
      <circle cx="340" cy="570" r="24" fill="#132C42" stroke="#8A9199" stroke-width="4"/>
      <circle cx="460" cy="570" r="52" fill="#04090F" stroke="#55636F" stroke-width="6"/>
      <circle cx="460" cy="570" r="24" fill="#132C42" stroke="#8A9199" stroke-width="4"/>
      <circle cx="800" cy="570" r="56" fill="#04090F" stroke="#55636F" stroke-width="6"/>
      <circle cx="800" cy="570" r="26" fill="#132C42" stroke="#8A9199" stroke-width="4"/>
      <!-- Jantes -->
      <g stroke="#8A9199" stroke-width="3">
        <line x1="220" y1="552" x2="220" y2="588"/>
        <line x1="202" y1="570" x2="238" y2="570"/>
        <line x1="340" y1="552" x2="340" y2="588"/>
        <line x1="322" y1="570" x2="358" y2="570"/>
        <line x1="460" y1="552" x2="460" y2="588"/>
        <line x1="442" y1="570" x2="478" y2="570"/>
        <line x1="800" y1="550" x2="800" y2="590"/>
        <line x1="780" y1="570" x2="820" y2="570"/>
      </g>
    </g>
  </g>

  <!-- Conteneurs empilés au premier plan -->
  <g>
    <rect x="950" y="560" width="220" height="70" rx="4" fill="#1B4965" stroke="#2D6A8E" stroke-width="3"/>
    <g stroke="#2D6A8E" stroke-width="3">
      <line x1="975" y1="560" x2="975" y2="630"/>
      <line x1="1000" y1="560" x2="1000" y2="630"/>
      <line x1="1025" y1="560" x2="1025" y2="630"/>
      <line x1="1050" y1="560" x2="1050" y2="630"/>
      <line x1="1075" y1="560" x2="1075" y2="630"/>
      <line x1="1100" y1="560" x2="1100" y2="630"/>
      <line x1="1125" y1="560" x2="1125" y2="630"/>
      <line x1="1150" y1="560" x2="1150" y2="630"/>
    </g>
    <rect x="950" y="490" width="220" height="70" rx="4" fill="#132C42" stroke="#2D6A8E" stroke-width="3" opacity="0.9"/>
    <g stroke="#2D6A8E" stroke-width="3" opacity="0.8">
      <line x1="975" y1="490" x2="975" y2="560"/>
      <line x1="1000" y1="490" x2="1000" y2="560"/>
      <line x1="1025" y1="490" x2="1025" y2="560"/>
      <line x1="1050" y1="490" x2="1050" y2="560"/>
      <line x1="1075" y1="490" x2="1075" y2="560"/>
      <line x1="1100" y1="490" x2="1100" y2="560"/>
      <line x1="1125" y1="490" x2="1125" y2="560"/>
      <line x1="1150" y1="490" x2="1150" y2="560"/>
    </g>
  </g>

  <!-- Panneau signalétique -->
  <g>
    <rect x="60" y="480" width="10" height="140" fill="#55636F"/>
    <rect x="30" y="440" width="110" height="46" rx="6" fill="#1F9D6B"/>
    <text x="44" y="470" fill="#F2F5F8" font-family="monospace" font-size="18" font-weight="bold">SORTIE</text>
  </g>
</svg>