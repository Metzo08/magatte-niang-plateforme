<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="vrdBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B1B2B"/>
      <stop offset="55%" stop-color="#132C42"/>
      <stop offset="100%" stop-color="#060E18"/>
    </linearGradient>
    <linearGradient id="deckBridge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5FA8D3"/>
      <stop offset="100%" stop-color="#2D6A8E"/>
    </linearGradient>
    <radialGradient id="vrdGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2D6A8E" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#2D6A8E" stop-opacity="0"/>
    </radialGradient>
    <pattern id="asphaltLine" width="100" height="16" patternUnits="userSpaceOnUse">
      <rect width="52" height="16" fill="#D9C285" opacity="0.5"/>
    </pattern>
  </defs>

  <rect width="1200" height="800" fill="url(#vrdBg)"/>
  <circle cx="600" cy="400" r="400" fill="url(#vrdGlow)"/>

  <!-- Soleil bas -->
  <circle cx="180" cy="330" r="120" fill="#F26A1B" opacity="0.18"/>
  <circle cx="180" cy="330" r="46" fill="#F58A45" opacity="0.55"/>

  <!-- Viaduc en arrière-plan -->
  <g>
    <!-- Tablier -->
    <rect x="0" y="270" width="1200" height="40" fill="url(#deckBridge)"/>
    <rect x="0" y="310" width="1200" height="8" fill="#1B4965"/>
    <!-- Garde-corps -->
    <g stroke="#9FC1D9" stroke-width="3" opacity="0.8">
      <line x1="0" y1="252" x2="1200" y2="252"/>
      <line x1="40" y1="252" x2="40" y2="270"/>
      <line x1="120" y1="252" x2="120" y2="270"/>
      <line x1="200" y1="252" x2="200" y2="270"/>
      <line x1="280" y1="252" x2="280" y2="270"/>
      <line x1="360" y1="252" x2="360" y2="270"/>
      <line x1="440" y1="252" x2="440" y2="270"/>
      <line x1="520" y1="252" x2="520" y2="270"/>
      <line x1="600" y1="252" x2="600" y2="270"/>
      <line x1="680" y1="252" x2="680" y2="270"/>
      <line x1="760" y1="252" x2="760" y2="270"/>
      <line x1="840" y1="252" x2="840" y2="270"/>
      <line x1="920" y1="252" x2="920" y2="270"/>
      <line x1="1000" y1="252" x2="1000" y2="270"/>
      <line x1="1080" y1="252" x2="1080" y2="270"/>
      <line x1="1160" y1="252" x2="1160" y2="270"/>
    </g>
    <!-- Piles -->
    <rect x="150" y="318" width="46" height="240" fill="#1B4965"/>
    <rect x="450" y="318" width="46" height="240" fill="#1B4965"/>
    <rect x="750" y="318" width="46" height="240" fill="#1B4965"/>
    <rect x="1050" y="318" width="46" height="240" fill="#1B4965"/>
    <!-- Captages -->
    <rect x="138" y="540" width="70" height="16" fill="#132C42"/>
    <rect x="438" y="540" width="70" height="16" fill="#132C42"/>
    <rect x="738" y="540" width="70" height="16" fill="#132C42"/>
    <rect x="1038" y="540" width="70" height="16" fill="#132C42"/>
    <!-- Voitures (silhouettes) -->
    <g fill="#04090F">
      <rect x="330" y="238" width="70" height="18" rx="8"/>
      <rect x="346" y="226" width="40" height="14" rx="6"/>
      <circle cx="346" cy="258" r="7"/>
      <circle cx="386" cy="258" r="7"/>
    </g>
    <g fill="#132C42">
      <rect x="640" y="238" width="66" height="18" rx="8"/>
      <rect x="654" y="226" width="38" height="14" rx="6"/>
      <circle cx="654" cy="258" r="7"/>
      <circle cx="692" cy="258" r="7"/>
    </g>
  </g>

  <!-- Sol / terrain -->
  <rect x="0" y="560" width="1200" height="240" fill="#0A1622"/>

  <!-- Coupe de chaussée (traits techniques VRD) -->
  <g>
    <rect x="60" y="620" width="540" height="34" fill="#2B3440"/>
    <rect x="60" y="654" width="540" height="30" fill="#55636F"/>
    <rect x="60" y="684" width="540" height="34" fill="#3E4A56"/>
    <rect x="60" y="718" width="540" height="40" fill="#2B3440" opacity="0.7"/>
    <!-- Ligne de chaussée -->
    <rect x="60" y="632" width="540" height="12" fill="url(#asphaltLine)"/>
    <!-- Cotes -->
    <g stroke="#5FA8D3" stroke-width="1.5" opacity="0.65">
      <line x1="614" y1="620" x2="614" y2="646"/>
      <line x1="614" y1="654" x2="614" y2="684"/>
      <line x1="614" y1="684" x2="614" y2="718"/>
      <line x1="606" y1="620" x2="622" y2="620"/>
      <line x1="606" y1="684" x2="622" y2="684"/>
      <line x1="606" y1="718" x2="622" y2="718"/>
      <line x1="614" y1="718" x2="614" y2="758"/>
    </g>
    <g font-family="monospace" font-size="13" fill="#5FA8D3" opacity="0.85">
      <text x="630" y="638">BB 8cm</text>
      <text x="630" y="674">GB 25cm</text>
      <text x="630" y="706">GNT 30cm</text>
      <text x="630" y="744">Cimetière / sol</text>
    </g>
  </g>

  <!-- Canalisation PEHD + regard -->
  <g>
    <!-- Regard de visite -->
    <rect x="850" y="620" width="120" height="140" fill="#3E4A56" stroke="#8A9199" stroke-width="3"/>
    <rect x="838" y="606" width="144" height="22" rx="4" fill="#55636F"/>
    <g stroke="#0A1622" stroke-width="4">
      <line x1="850" y1="617" x2="856" y2="609"/>
      <line x1="880" y1="617" x2="886" y2="609"/>
      <line x1="910" y1="617" x2="916" y2="609"/>
      <line x1="940" y1="617" x2="946" y2="609"/>
      <line x1="966" y1="617" x2="972" y2="609"/>
    </g>
    <!-- Tuyaux dans le regard -->
    <circle cx="910" cy="680" r="30" fill="#0A1622" stroke="#8A9199" stroke-width="4"/>
    <circle cx="910" cy="680" r="18" fill="#132C42"/>
    <circle cx="910" cy="730" r="22" fill="#0A1622" stroke="#8A9199" stroke-width="3"/>
    <circle cx="910" cy="730" r="12" fill="#1B4965"/>
  </g>

  <!-- Niveau laser -->
  <g>
    <rect x="740" y="560" width="8" height="120" fill="#55636F"/>
    <g stroke="#F26A1B" stroke-width="2" opacity="0.75">
      <line x1="560" y1="560" x2="1180" y2="560"/>
    </g>
    <circle cx="744" cy="560" r="7" fill="#F26A1B"/>
    <text x="1090" y="552" font-family="monospace" font-size="13" fill="#F26A1B">RN +1.20</text>
  </g>
</svg>