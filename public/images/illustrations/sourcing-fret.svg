<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="portBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#12082A"/>
      <stop offset="50%" stop-color="#241040"/>
      <stop offset="100%" stop-color="#0A0518"/>
    </linearGradient>
    <linearGradient id="hullShip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2D6A8E"/>
      <stop offset="60%" stop-color="#1B4965"/>
      <stop offset="100%" stop-color="#0B1B2B"/>
    </linearGradient>
    <radialGradient id="portGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9B6BC8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#9B6BC8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="wavePattern" width="80" height="18" patternUnits="userSpaceOnUse">
      <path d="M0 9 Q20 0 40 9 T80 9" fill="none" stroke="#7A5AA8" stroke-width="2" opacity="0.25"/>
    </pattern>
  </defs>

  <rect width="1200" height="800" fill="url(#portBg)"/>
  <circle cx="600" cy="330" r="380" fill="url(#portGlow)"/>

  <!-- Lune violette -->
  <circle cx="960" cy="120" r="46" fill="#D9C8F0" opacity="0.85"/>
  <circle cx="946" cy="108" r="9" fill="#B8A0E0" opacity="0.7"/>
  <circle cx="975" cy="132" r="6" fill="#B8A0E0" opacity="0.6"/>

  <!-- Étoiles -->
  <g fill="#D9C8F0">
    <circle cx="100" cy="70" r="1.6" opacity="0.8"/>
    <circle cx="240" cy="130" r="1.3" opacity="0.6"/>
    <circle cx="380" cy="60" r="1.8" opacity="0.85"/>
    <circle cx="520" cy="110" r="1.3" opacity="0.6"/>
    <circle cx="660" cy="70" r="1.5" opacity="0.75"/>
    <circle cx="820" cy="150" r="1.3" opacity="0.6"/>
    <circle cx="1120" cy="90" r="1.5" opacity="0.75"/>
    <circle cx="160" cy="190" r="1.2" opacity="0.5"/>
  </g>

  <!-- Grues portiques (ship-to-shore) -->
  <g>
    <!-- Grue 1 -->
    <g>
      <line x1="300" y1="120" x2="300" y2="520" stroke="#B8A0E0" stroke-width="8"/>
      <line x1="380" y1="120" x2="380" y2="520" stroke="#B8A0E0" stroke-width="8"/>
      <rect x="280" y="106" width="120" height="16" fill="#9B6BC8"/>
      <rect x="280" y="122" width="14" height="180" fill="#9B6BC8" opacity="0.5"/>
      <path d="M282 118 L520 88 L524 100 L286 132 Z" fill="#D9C8F0"/>
      <line x1="360" y1="108" x2="440" y2="60" stroke="#B8A0E0" stroke-width="3"/>
      <line x1="520" y1="94" x2="440" y2="60" stroke="#B8A0E0" stroke-width="3"/>
      <line x1="470" y1="98" x2="470" y2="290" stroke="#D9C8F0" stroke-width="2.5"/>
      <rect x="456" y="290" width="28" height="16" fill="#E0A800"/>
    </g>
    <!-- Grue 2 (plus lointaine) -->
    <g opacity="0.6">
      <line x1="130" y1="180" x2="130" y2="520" stroke="#7A5AA8" stroke-width="6"/>
      <rect x="112" y="168" width="90" height="12" fill="#7A5AA8"/>
      <path d="M114 178 L300 152 L303 162 L117 190 Z" fill="#9B6BC8"/>
      <line x1="240" y1="160" x2="240" y2="320" stroke="#9B6BC8" stroke-width="2"/>
      <rect x="230" y="320" width="20" height="12" fill="#E0A800"/>
    </g>
  </g>

  <!-- Navire porte-conteneurs -->
  <g>
    <!-- Coque -->
    <path d="M60 520 L920 520 L860 640 L140 640 Z" fill="url(#hullShip)"/>
    <path d="M60 520 L920 520 L905 552 L75 552 Z" fill="#F26A1B" opacity="0.85"/>
    <!-- Château central -->
    <rect x="760" y="400" width="130" height="120" fill="#E4EEF6" opacity="0.92"/>
    <rect x="760" y="400" width="130" height="14" fill="#2D6A8E"/>
    <g fill="#1B4965">
      <rect x="775" y="428" width="22" height="18"/>
      <rect x="807" y="428" width="22" height="18"/>
      <rect x="839" y="428" width="22" height="18"/>
      <rect x="775" y="458" width="22" height="18"/>
      <rect x="807" y="458" width="22" height="18"/>
      <rect x="839" y="458" width="22" height="18"/>
    </g>
    <rect x="806" y="360" width="14" height="40" fill="#2D6A8E"/>
    <circle cx="813" cy="356" r="6" fill="#F26A1B"/>
    <!-- Conteneurs sur le pont (rangées) -->
    <g>
      <rect x="100" y="486" width="90" height="34" fill="#7A5AA8"/>
      <rect x="196" y="486" width="90" height="34" fill="#2D6A8E"/>
      <rect x="292" y="486" width="90" height="34" fill="#E0A800"/>
      <rect x="388" y="486" width="90" height="34" fill="#7A5AA8"/>
      <rect x="484" y="486" width="90" height="34" fill="#2D6A8E"/>
      <rect x="580" y="486" width="90" height="34" fill="#E0A800"/>
      <rect x="676" y="486" width="70" height="34" fill="#7A5AA8"/>
    </g>
    <g opacity="0.9">
      <rect x="148" y="452" width="90" height="34" fill="#2D6A8E"/>
      <rect x="244" y="452" width="90" height="34" fill="#E0A800"/>
      <rect x="340" y="452" width="90" height="34" fill="#7A5AA8"/>
      <rect x="436" y="452" width="90" height="34" fill="#2D6A8E"/>
      <rect x="532" y="452" width="90" height="34" fill="#7A5AA8"/>
      <rect x="628" y="452" width="90" height="34" fill="#E0A800"/>
    </g>
    <g opacity="0.8">
      <rect x="196" y="418" width="90" height="34" fill="#E0A800"/>
      <rect x="292" y="418" width="90" height="34" fill="#7A5AA8"/>
      <rect x="388" y="418" width="90" height="34" fill="#2D6A8E"/>
      <rect x="484" y="418" width="90" height="34" fill="#E0A800"/>
      <rect x="580" y="418" width="90" height="34" fill="#2D6A8E"/>
    </g>
  </g>

  <!-- Eau -->
  <rect x="0" y="640" width="1200" height="160" fill="#0E0620"/>
  <rect x="0" y="640" width="1200" height="160" fill="url(#wavePattern)"/>
  <!-- Reflets -->
  <g stroke="#9B6BC8" stroke-width="3" opacity="0.35">
    <line x1="200" y1="668" x2="360" y2="668"/>
    <line x1="480" y1="690" x2="700" y2="690"/>
    <line x1="760" y1="716" x2="880" y2="716"/>
  </g>
  <g stroke="#E0A800" stroke-width="2.5" opacity="0.3">
    <line x1="120" y1="700" x2="260" y2="700"/>
    <line x1="560" y1="740" x2="680" y2="740"/>
  </g>

  <!-- Conteneurs du parc (quai, premier plan) -->
  <g>
    <rect x="960" y="600" width="240" height="44" fill="#7A5AA8"/>
    <rect x="960" y="556" width="240" height="44" fill="#2D6A8E"/>
    <rect x="960" y="512" width="240" height="44" fill="#E0A800" opacity="0.92"/>
    <g stroke="#0A0518" stroke-width="2.5" opacity="0.55">
      <line x1="1010" y1="512" x2="1010" y2="644"/>
      <line x1="1060" y1="512" x2="1060" y2="644"/>
      <line x1="1110" y1="512" x2="1110" y2="644"/>
      <line x1="1160" y1="512" x2="1160" y2="644"/>
    </g>
  </g>

  <!-- Texte maritime -->
  <text x="70" y="756" font-family="monospace" font-size="15" fill="#B8A0E0" opacity="0.8">PGT · FRET MARITIME · TRANSIT &amp; DÉDOUANEMENT</text>
</svg>