<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="engBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B1B2B"/>
      <stop offset="55%" stop-color="#132C42"/>
      <stop offset="100%" stop-color="#060E18"/>
    </linearGradient>
    <linearGradient id="engBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F9B685"/>
      <stop offset="50%" stop-color="#F26A1B"/>
      <stop offset="100%" stop-color="#A8430A"/>
    </linearGradient>
    <radialGradient id="engGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F26A1B" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#F26A1B" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dirtTexture" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="8" r="2" fill="#3E3428" opacity="0.7"/>
      <circle cx="18" cy="18" r="2.5" fill="#2B241C" opacity="0.7"/>
    </pattern>
  </defs>

  <rect width="1200" height="800" fill="url(#engBg)"/>
  <circle cx="600" cy="420" r="400" fill="url(#engGlow)"/>

  <!-- Lune + étoiles -->
  <circle cx="180" cy="110" r="40" fill="#E4EEF6" opacity="0.85"/>
  <circle cx="168" cy="100" r="8" fill="#C5DCEA" opacity="0.7"/>
  <circle cx="192" cy="122" r="5" fill="#C5DCEA" opacity="0.6"/>
  <g fill="#9FC1D9">
    <circle cx="340" cy="60" r="1.6" opacity="0.8"/>
    <circle cx="500" cy="120" r="1.3" opacity="0.6"/>
    <circle cx="660" cy="70" r="1.7" opacity="0.8"/>
    <circle cx="820" cy="130" r="1.3" opacity="0.6"/>
    <circle cx="980" cy="60" r="1.5" opacity="0.75"/>
    <circle cx="1120" cy="140" r="1.4" opacity="0.65"/>
    <circle cx="560" cy="180" r="1.2" opacity="0.5"/>
  </g>

  <!-- Talus de terre -->
  <g>
    <path d="M0 620 Q300 520 700 600 T1200 580 L1200 800 L0 800 Z" fill="#2B241C"/>
    <path d="M0 620 Q300 520 700 600 T1200 580 L1200 800 L0 800 Z" fill="url(#dirtTexture)"/>
    <path d="M0 660 Q400 600 800 650 T1200 640 L1200 800 L0 800 Z" fill="#1C1712"/>
  </g>

  <!-- Pelle hydraulique -->
  <g>
    <!-- Chenilles -->
    <g>
      <rect x="420" y="560" width="320" height="70" rx="35" fill="#04090F" stroke="#55636F" stroke-width="6"/>
      <!-- Gabarits de chenille -->
      <g fill="#132C42">
        <circle cx="470" cy="595" r="26"/>
        <circle cx="540" cy="595" r="26"/>
        <circle cx="610" cy="595" r="26"/>
        <circle cx="680" cy="595" r="26"/>
      </g>
      <g stroke="#8A9199" stroke-width="3" opacity="0.7">
        <line x1="470" y1="575" x2="470" y2="615"/>
        <line x1="540" y1="575" x2="540" y2="615"/>
        <line x1="610" y1="575" x2="610" y2="615"/>
        <line x1="680" y1="575" x2="680" y2="615"/>
      </g>
      <!-- Barbotins -->
      <circle cx="460" cy="580" r="16" fill="#1B4965"/>
      <circle cx="700" cy="580" r="16" fill="#1B4965"/>
    </g>

    <!-- Tourelle -->
    <rect x="440" y="470" width="240" height="95" rx="16" fill="url(#engBody)"/>
    <rect x="440" y="540" width="240" height="25" rx="8" fill="#6B2A05"/>
    <!-- Contrepoids -->
    <rect x="430" y="478" width="34" height="80" rx="6" fill="#A8430A"/>

    <!-- Cabine -->
    <rect x="600" y="420" width="100" height="110" rx="10" fill="#132C42" stroke="#5FA8D3" stroke-width="4"/>
    <rect x="610" y="432" width="80" height="60" rx="6" fill="#5FA8D3" opacity="0.4"/>
    <!-- Feux de gabarit cabine -->
    <circle cx="606" cy="426" r="4" fill="#F9B685"/>

    <!-- Potence -->
    <path d="M560 500 L790 300 L830 340 L600 545 Z" fill="url(#engBody)"/>
    <path d="M560 500 L790 300 L830 340 L600 545 Z" fill="#0B1B2B" opacity="0.15"/>
    <rect x="770" y="280" width="80" height="60" rx="8" fill="#A8430A"/>

    <!-- Bras (balancier) -->
    <path d="M810 330 L930 430 L900 470 L780 370 Z" fill="url(#engBody)"/>
    <circle cx="810" cy="330" r="17" fill="#6B2A05"/>
    <circle cx="810" cy="330" r="8" fill="#D9C285"/>

    <!-- Godet -->
    <g>
      <circle cx="920" cy="455" r="14" fill="#6B2A05"/>
      <path d="M900 460 Q1000 450 1030 510 Q1010 560 950 545 Q920 520 900 460 Z" fill="#8A9199"/>
      <path d="M900 460 Q1000 450 1030 510 L1014 516 Q990 470 908 476 Z" fill="#B8C4D0"/>
      <!-- Dents -->
      <g fill="#DDE3E8">
        <path d="M1000 522 L1030 545 L1014 552 Z"/>
        <path d="M972 538 L996 566 L978 571 Z"/>
        <path d="M940 544 L956 574 L938 576 Z"/>
      </g>
      <!-- Terre dans le godet -->
      <circle cx="975" cy="520" r="12" fill="#3E3428"/>
      <circle cx="955" cy="512" r="9" fill="#2B241C"/>
    </g>

    <!-- Vérins hydrauliques -->
    <g stroke="#B8C4D0" stroke-width="9" stroke-linecap="round">
      <line x1="600" y1="540" x2="700" y2="380"/>
      <line x1="810" y1="390" x2="880" y2="430"/>
    </g>
    <g stroke="#55636F" stroke-width="4" stroke-linecap="round">
      <line x1="600" y1="540" x2="650" y2="470"/>
      <line x1="810" y1="390" x2="845" y2="410"/>
    </g>
  </g>

  <!-- Camion à benne basculante attendant chargement -->
  <g opacity="0.95">
    <rect x="880" y="620" width="260" height="70" rx="6" fill="#1B4965" stroke="#2D6A8E" stroke-width="3"/>
    <rect x="880" y="590" width="240" height="40" rx="4" fill="#2D6A8E"/>
    <rect x="1130" y="580" width="60" height="110" rx="8" fill="#E0A800"/>
    <rect x="1140" y="594" width="40" height="34" rx="4" fill="#0B1B2B" opacity="0.7"/>
    <circle cx="940" cy="700" r="28" fill="#04090F" stroke="#55636F" stroke-width="5"/>
    <circle cx="940" cy="700" r="12" fill="#132C42"/>
    <circle cx="1080" cy="700" r="28" fill="#04090F" stroke="#55636F" stroke-width="5"/>
    <circle cx="1080" cy="700" r="12" fill="#132C42"/>
  </g>

  <!-- Balise de chantier clignotante -->
  <g>
    <line x1="130" y1="600" x2="130" y2="660" stroke="#55636F" stroke-width="5"/>
    <circle cx="130" cy="590" r="18" fill="#F26A1B" opacity="0.35"/>
    <circle cx="130" cy="590" r="8" fill="#F26A1B"/>
  </g>

  <!-- Oiseaux -->
  <g stroke="#8A9199" stroke-width="2.5" fill="none" opacity="0.6">
    <path d="M420 160 q10 -10 20 0 q10 -10 20 0"/>
    <path d="M480 190 q8 -8 16 0 q8 -8 16 0"/>
  </g>
</svg>