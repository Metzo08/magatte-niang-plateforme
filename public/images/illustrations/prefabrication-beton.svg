<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="indBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B1B2B"/>
      <stop offset="55%" stop-color="#16283A"/>
      <stop offset="100%" stop-color="#060E18"/>
    </linearGradient>
    <linearGradient id="concrete" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8A9199"/>
      <stop offset="100%" stop-color="#55636F"/>
    </linearGradient>
    <linearGradient id="concreteLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B8C4D0"/>
      <stop offset="100%" stop-color="#8A9199"/>
    </linearGradient>
    <radialGradient id="indGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E0A800" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#E0A800" stop-opacity="0"/>
    </radialGradient>
    <pattern id="hatchConcrete" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M0 22L22 0" stroke="#3E4A56" stroke-width="1.5" opacity="0.5"/>
    </pattern>
    <pattern id="indRoof" width="56" height="26" patternUnits="userSpaceOnUse">
      <path d="M0 26 L28 0 L56 26" fill="none" stroke="#2D6A8E" stroke-width="4"/>
    </pattern>
  </defs>

  <rect width="1200" height="800" fill="url(#indBg)"/>
  <circle cx="600" cy="360" r="400" fill="url(#indGlow)"/>

  <!-- Usine en arrière-plan -->
  <g>
    <rect x="60" y="300" width="520" height="220" fill="#0F2436"/>
    <rect x="60" y="300" width="520" height="34" fill="url(#indRoof)" opacity="0.9"/>
    <!-- Shed de toiture -->
    <g fill="#132C42">
      <rect x="80" y="280" width="60" height="24"/>
      <rect x="150" y="280" width="60" height="24"/>
      <rect x="220" y="280" width="60" height="24"/>
      <rect x="290" y="280" width="60" height="24"/>
      <rect x="360" y="280" width="60" height="24"/>
      <rect x="430" y="280" width="60" height="24"/>
      <rect x="500" y="280" width="60" height="24"/>
    </g>
    <!-- Baies vitrées -->
    <g fill="#F9B685" opacity="0.55">
      <rect x="90" y="380" width="60" height="90"/>
      <rect x="180" y="380" width="60" height="90"/>
      <rect x="270" y="380" width="60" height="90"/>
      <rect x="360" y="380" width="60" height="90"/>
      <rect x="450" y="380" width="60" height="90"/>
    </g>
    <!-- Silo à ciment -->
    <g>
      <path d="M640 240 a55 40 0 0 1 110 0 v190 h-110 Z" fill="#2D6A8E"/>
      <path d="M640 240 a55 40 0 0 1 110 0" fill="#5FA8D3"/>
      <rect x="628" y="230" width="134" height="18" rx="6" fill="#1B4965"/>
      <g stroke="#132C42" stroke-width="3" opacity="0.6">
        <line x1="695" y1="250" x2="695" y2="420"/>
      </g>
      <rect x="670" y="430" width="20" height="80" fill="#1B4965"/>
      <path d="M660 510 h40 l-8 24 h-24 Z" fill="#132C42"/>
    </g>
    <!-- Cheminée -->
    <rect x="500" y="180" width="34" height="140" fill="#1B4965"/>
    <rect x="494" y="172" width="46" height="14" rx="4" fill="#2D6A8E"/>
    <!-- Fumée -->
    <g fill="#8A9199" opacity="0.28">
      <circle cx="517" cy="150" r="18"/>
      <circle cx="530" cy="122" r="24"/>
      <circle cx="514" cy="90" r="30"/>
    </g>
  </g>

  <!-- Pont-portique de manutention -->
  <g>
    <line x1="120" y1="150" x2="1140" y2="150" stroke="#E0A800" stroke-width="6"/>
    <rect x="120" y="140" width="1020" height="20" fill="#C8A24A" opacity="0.35"/>
    <rect x="1020" y="150" width="60" height="18" fill="#C8A24A"/>
    <line x1="1050" y1="168" x2="1050" y2="240" stroke="#C8A24A" stroke-width="3"/>
    <line x1="1050" y1="240" x2="1020" y2="268" stroke="#C8A24A" stroke-width="3"/>
    <line x1="1050" y1="240" x2="1080" y2="268" stroke="#C8A24A" stroke-width="3"/>
    <rect x="1014" y="268" width="72" height="12" fill="#E0A800"/>
  </g>

  <!-- Éléments préfabriqués au premier plan -->
  <g>
    <!-- Prédalle -->
    <g>
      <rect x="70" y="560" width="300" height="26" fill="url(#concreteLight)"/>
      <rect x="70" y="560" width="300" height="26" fill="url(#hatchConcrete)" opacity="0.6"/>
      <!-- Armatures sortantes -->
      <g stroke="#D9C285" stroke-width="2.5">
        <line x1="95" y1="560" x2="95" y2="540"/>
        <line x1="145" y1="560" x2="145" y2="540"/>
        <line x1="195" y1="560" x2="195" y2="540"/>
        <line x1="245" y1="560" x2="245" y2="540"/>
        <line x1="295" y1="560" x2="295" y2="540"/>
        <line x1="345" y1="560" x2="345" y2="540"/>
      </g>
    </g>
    <!-- Bordures empilées -->
    <g>
      <rect x="420" y="600" width="260" height="24" fill="url(#concrete)"/>
      <rect x="428" y="574" width="244" height="24" fill="url(#concreteLight)"/>
      <rect x="436" y="548" width="228" height="24" fill="url(#concrete)"/>
      <rect x="444" y="522" width="212" height="24" fill="url(#concreteLight)"/>
    </g>
    <!-- Poutre précontrainte -->
    <g>
      <rect x="730" y="580" width="360" height="44" fill="url(#concrete)"/>
      <rect x="730" y="580" width="360" height="44" fill="url(#hatchConcrete)" opacity="0.5"/>
      <path d="M730 624 h360 l-26 30 h-308 Z" fill="#3E4A56"/>
      <!-- Câbles de précontrainte -->
      <g stroke="#D9C285" stroke-width="2.5" opacity="0.9">
        <line x1="744" y1="590" x2="1076" y2="590"/>
        <line x1="744" y1="602" x2="1076" y2="602"/>
      </g>
    </g>
  </g>

  <!-- Carrousel de béton (camion malaxeur simplifié) -->
  <g>
    <path d="M120 420 L300 380 L330 470 L150 510 Z" fill="#2D6A8E"/>
    <path d="M140 430 L286 396 L306 462 L160 496 Z" fill="#132C42" opacity="0.4"/>
    <circle cx="150" cy="520" r="24" fill="#04090F" stroke="#55636F" stroke-width="4"/>
    <circle cx="280" cy="500" r="24" fill="#04090F" stroke="#55636F" stroke-width="4"/>
  </g>

  <!-- Ouvriers (silhouettes) -->
  <g fill="#04090F">
    <circle cx="640" cy="540" r="9"/>
    <path d="M630 550 h20 l4 34 h-28 Z"/>
    <circle cx="676" cy="546" r="9"/>
    <path d="M666 556 h20 l4 34 h-28 Z"/>
  </g>
  <path d="M631 534 a9 9 0 0 1 18 0 Z" fill="#F26A1B"/>
  <path d="M667 540 a9 9 0 0 1 18 0 Z" fill="#F26A1B"/>

  <!-- Sol -->
  <rect x="0" y="660" width="1200" height="140" fill="#04090F"/>
  <line x1="0" y1="660" x2="1200" y2="660" stroke="#8A9199" stroke-width="1.5" opacity="0.25"/>
</svg>