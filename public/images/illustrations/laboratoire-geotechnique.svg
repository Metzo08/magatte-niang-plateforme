<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="labBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#07130D"/>
      <stop offset="55%" stop-color="#0B2418"/>
      <stop offset="100%" stop-color="#04120B"/>
    </linearGradient>
    <linearGradient id="glassTube" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7BE3B4" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#1F9D6B" stop-opacity="0.55"/>
    </linearGradient>
    <radialGradient id="greenGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1F9D6B" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#1F9D6B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="benchTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#134D33"/>
      <stop offset="100%" stop-color="#0B2E1E"/>
    </linearGradient>
    <pattern id="labGrid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#1F9D6B" stroke-width="1" opacity="0.08"/>
    </pattern>
  </defs>

  <rect width="1200" height="800" fill="url(#labBg)"/>
  <rect width="1200" height="800" fill="url(#labGrid)"/>

  <!-- Halo central -->
  <circle cx="600" cy="380" r="360" fill="url(#greenGlow)"/>

  <!-- Étagère murale avec échantillons -->
  <g>
    <rect x="80" y="120" width="300" height="10" fill="#134D33"/>
    <g>
      <rect x="100" y="70" width="26" height="50" rx="4" fill="#0E3A26" stroke="#1F9D6B" stroke-width="2"/>
      <rect x="104" y="88" width="18" height="28" rx="2" fill="#7BE3B4" opacity="0.5"/>
      <rect x="140" y="78" width="26" height="42" rx="4" fill="#0E3A26" stroke="#1F9D6B" stroke-width="2"/>
      <rect x="144" y="94" width="18" height="22" rx="2" fill="#7BE3B4" opacity="0.35"/>
      <rect x="180" y="64" width="26" height="56" rx="4" fill="#0E3A26" stroke="#1F9D6B" stroke-width="2"/>
      <rect x="184" y="82" width="18" height="34" rx="2" fill="#7BE3B4" opacity="0.6"/>
      <rect x="230" y="74" width="34" height="46" rx="3" fill="#0E3A26" stroke="#1F9D6B" stroke-width="2"/>
      <rect x="234" y="92" width="26" height="24" rx="2" fill="#D9C285" opacity="0.5"/>
      <rect x="280" y="68" width="34" height="52" rx="3" fill="#0E3A26" stroke="#1F9D6B" stroke-width="2"/>
      <rect x="284" y="86" width="26" height="30" rx="2" fill="#D9C285" opacity="0.35"/>
    </g>
    <rect x="80" y="230" width="300" height="10" fill="#134D33"/>
    <g opacity="0.85">
      <rect x="110" y="190" width="30" height="40" rx="3" fill="#0E3A26" stroke="#1F9D6B" stroke-width="2"/>
      <rect x="160" y="182" width="30" height="48" rx="3" fill="#0E3A26" stroke="#1F9D6B" stroke-width="2"/>
      <rect x="215" y="196" width="40" height="34" rx="3" fill="#0E3A26" stroke="#1F9D6B" stroke-width="2"/>
      <rect x="275" y="186" width="40" height="44" rx="3" fill="#0E3A26" stroke="#1F9D6B" stroke-width="2"/>
    </g>
  </g>

  <!-- Éprouvette centrale avec échantillon de sol -->
  <g>
    <rect x="560" y="90" width="80" height="420" rx="14" fill="#0A1F15" stroke="url(#glassTube)" stroke-width="5"/>
    <!-- Couches de sol -->
    <rect x="568" y="330" width="64" height="60" fill="#6B4A2E"/>
    <rect x="568" y="390" width="64" height="50" fill="#8A6238"/>
    <rect x="568" y="440" width="64" height="40" fill="#A87C4F"/>
    <rect x="568" y="480" width="64" height="22" fill="#C8A24A" opacity="0.8"/>
    <!-- Bulles -->
    <g fill="#7BE3B4" opacity="0.5">
      <circle cx="585" cy="300" r="4"/>
      <circle cx="615" cy="270" r="3"/>
      <circle cx="600" cy="240" r="2.5"/>
    </g>
    <!-- Graduations -->
    <g stroke="#7BE3B4" stroke-width="2" opacity="0.7">
      <line x1="640" y1="140" x2="655" y2="140"/>
      <line x1="640" y1="190" x2="655" y2="190"/>
      <line x1="640" y1="240" x2="655" y2="240"/>
      <line x1="640" y1="290" x2="655" y2="290"/>
      <line x1="640" y1="340" x2="655" y2="340"/>
      <line x1="640" y1="390" x2="655" y2="390"/>
      <line x1="640" y1="440" x2="655" y2="440"/>
    </g>
    <rect x="548" y="510" width="104" height="18" rx="4" fill="#134D33"/>
  </g>

  <!-- Fioles latérales -->
  <g>
    <path d="M420 250 h44 v70 l30 90 a14 14 0 0 1 -14 18 h-76 a14 14 0 0 1 -14 -18 l30 -90 Z" fill="#0A1F15" stroke="#1F9D6B" stroke-width="4"/>
    <path d="M404 420 l22 -66 h32 l22 66 a10 10 0 0 1 -10 12 h-56 a10 10 0 0 1 -10 -12 Z" fill="#7BE3B4" opacity="0.45"/>
    <circle cx="442" cy="400" r="4" fill="#7BE3B4" opacity="0.7"/>
    <circle cx="452" cy="380" r="3" fill="#7BE3B4" opacity="0.6"/>
  </g>
  <g>
    <rect x="740" y="240" width="60" height="180" rx="10" fill="#0A1F15" stroke="#1F9D6B" stroke-width="4"/>
    <rect x="748" y="330" width="44" height="82" rx="6" fill="#D9C285" opacity="0.5"/>
    <rect x="748" y="300" width="44" height="20" rx="4" fill="#7BE3B4" opacity="0.4"/>
  </g>

  <!-- Presse CBR (machine d'essai) -->
  <g>
    <rect x="920" y="180" width="180" height="24" fill="#134D33"/>
    <rect x="920" y="560" width="180" height="30" fill="#134D33"/>
    <rect x="940" y="204" width="14" height="356" fill="#0E3A26" stroke="#1F9D6B" stroke-width="2"/>
    <rect x="1066" y="204" width="14" height="356" fill="#0E3A26" stroke="#1F9D6B" stroke-width="2"/>
    <rect x="920" y="330" width="180" height="18" fill="#0E3A26" stroke="#1F9D6B" stroke-width="2"/>
    <rect x="988" y="348" width="44" height="90" fill="#1F9D6B" opacity="0.85"/>
    <rect x="996" y="438" width="28" height="30" fill="#7BE3B4"/>
    <rect x="960" y="468" width="100" height="26" rx="4" fill="#0E3A26" stroke="#1F9D6B" stroke-width="2"/>
    <circle cx="1010" cy="481" r="6" fill="#D9C285"/>
    <!-- Jauge digitale -->
    <rect x="936" y="240" width="70" height="46" rx="6" fill="#04120B" stroke="#1F9D6B" stroke-width="2"/>
    <text x="946" y="270" fill="#7BE3B4" font-family="monospace" font-size="20">6.8</text>
    <text x="946" y="284" fill="#7BE3B4" font-family="monospace" font-size="11">kN</text>
  </g>

  <!-- Paillasse -->
  <rect x="0" y="590" width="1200" height="26" fill="url(#benchTop)"/>
  <rect x="0" y="616" width="1200" height="184" fill="#061A10"/>
  <line x1="0" y1="590" x2="1200" y2="590" stroke="#7BE3B4" stroke-width="2" opacity="0.4"/>

  <!-- Cylindres d'essai sur paillasse -->
  <g>
    <rect x="120" y="520" width="56" height="70" rx="6" fill="#0A1F15" stroke="#1F9D6B" stroke-width="3"/>
    <rect x="126" y="556" width="44" height="30" rx="4" fill="#8A6238" opacity="0.8"/>
    <rect x="200" y="532" width="56" height="58" rx="6" fill="#0A1F15" stroke="#1F9D6B" stroke-width="3"/>
    <rect x="206" y="560" width="44" height="26" rx="4" fill="#A87C4F" opacity="0.8"/>
    <rect x="280" y="524" width="56" height="66" rx="6" fill="#0A1F15" stroke="#1F9D6B" stroke-width="3"/>
    <rect x="286" y="552" width="44" height="34" rx="4" fill="#6B4A2E" opacity="0.8"/>
  </g>

  <!-- Documents / PV d'essai -->
  <g>
    <rect x="880" y="520" width="150" height="70" rx="4" fill="#F2F5F8" opacity="0.92"/>
    <g stroke="#55636F" stroke-width="3" opacity="0.7">
      <line x1="896" y1="538" x2="1014" y2="538"/>
      <line x1="896" y1="552" x2="1014" y2="552"/>
      <line x1="896" y1="566" x2="980" y2="566"/>
    </g>
    <rect x="896" y="574" width="46" height="8" fill="#1F9D6B"/>
  </g>

  <!-- Molécule / atomes décoratifs -->
  <g stroke="#7BE3B4" stroke-width="2.5" opacity="0.5">
    <line x1="360" y1="420" x2="400" y2="445"/>
    <line x1="400" y1="445" x2="440" y2="420"/>
    <line x1="400" y1="445" x2="400" y2="490"/>
  </g>
  <g fill="#7BE3B4" opacity="0.65">
    <circle cx="360" cy="420" r="7"/>
    <circle cx="440" cy="420" r="7"/>
    <circle cx="400" cy="490" r="7"/>
    <circle cx="400" cy="445" r="5" fill="#D9C285"/>
  </g>
</svg>