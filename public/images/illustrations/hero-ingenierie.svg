    <rect x="362" y="472" width="66" height="41" fill="url(#deckHatch)"/>
    <rect x="432" y="517" width="66" height="41" fill="url(#deckHatch)"/>
    <rect x="502" y="562" width="66" height="41" fill="url(#deckHatch)"/>
