      <line x1="360" y1="515" x2="570" y2="515"/>
      <line x1="360" y1="560" x2="570" y2="560"/>
      <line x1="360" y1="605" x2="570" y2="605"/>
      <line x1="360" y1="650" x2="570" y2="650"/>
