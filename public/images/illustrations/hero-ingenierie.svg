    <rect x="756" y="690" width="48" height="14" fill="#0A1622"/>
    <rect x="754" y="192" width="52" height="14" fill="#0A1622"/>
    <rect x="794" y="168" width="36" height="26" rx="2" fill="#0A1622"/>
    <rect x="800" y="173" width="22" height="14" fill="#F9B685" opacity="0.75"/>
    <path d="M768 205 L780 118 L792 205 Z" fill="#0A1622"/>
    <rect x="780" y="180" width="470" height="20" fill="url(#lattice)"/>
    <line x1="780" y1="180" x2="1250" y2="180" stroke="#0A1622" stroke-width="3"/>
    <line x1="780" y1="200" x2="1250" y2="200" stroke="#0A1622" stroke-width="3"/>
    <rect x="1246" y="176" width="10" height="26" fill="#0A1622"/>
    <rect x="648" y="184" width="120" height="14" fill="url(#lattice)"/>
    <rect x="652" y="198" width="30" height="26" fill="#0A1622"/>
    <rect x="690" y="198" width="30" height="20" fill="#0A1622"/>
    <line x1="780" y1="122" x2="920" y2="182" stroke="#0A1622" stroke-width="2.5"/>
    <line x1="780" y1="122" x2="672" y2="186" stroke="#0A1622" stroke-width="2.5"/>
    <circle cx="780" cy="114" r="12" fill="url(#beaconGlow)"/>
    <circle cx="780" cy="114" r="4" fill="#F26A1B"/>
