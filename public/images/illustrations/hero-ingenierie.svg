  <rect x="0" y="700" width="1600" height="200" fill="url(#ground)"/>
  <line x1="0" y1="700" x2="1600" y2="700" stroke="#5FA8D3" stroke-width="1.5" opacity="0.15"/>

  <!-- Premier plan : poutres empilées -->
  <g>
    <rect x="60" y="800" width="320" height="14" fill="#132C42"/>
    <line x1="60" y1="800" x2="380" y2="800" stroke="#5FA8D3" stroke-width="1.5" opacity="0.3"/>
    <rect x="70" y="822" width="300" height="14" fill="#132C42"/>
    <rect x="80" y="844" width="280" height="14" fill="#132C42"/>
    <rect x="60" y="800" width="7" height="14" fill="#F58A45" opacity="0.6"/>
    <rect x="373" y="800" width="7" height="14" fill="#F58A45" opacity="0.6"/>
  </g>

  <!-- Barrières + balise -->
  <path d="M480 760 h70 l-8 26 h-54 Z" fill="#0F2436"/>
  <rect x="488" y="766" width="54" height="5" fill="#F26A1B" opacity="0.7"/>
  <path d="M560 764 h64 l-7 24 h-50 Z" fill="#0F2436"/>
  <rect x="568" y="770" width="48" height="5" fill="#F26A1B" opacity="0.7"/>
  <line x1="660" y1="700" x2="660" y2="745" stroke="#0A1622" stroke-width="4"/>
  <circle cx="660" cy="742" r="14" fill="url(#beaconGlow)"/>
  <circle cx="660" cy="742" r="5" fill="#F26A1B"/>

  <!-- Silhouettes d'ingénieurs -->
  <g fill="#04090F">
    <circle cx="722" cy="666" r="7"/>
    <path d="M713 675 h18 l5 26 h-28 Z"/>
    <circle cx="752" cy="670" r="6.5"/>
    <path d="M744 678 h16 l4 24 h-24 Z"/>
  </g>
  <rect x="716" y="690" width="4" height="12" fill="#F58A45" opacity="0.5"/>

  <!-- Grille blueprint -->
  <rect width="1600" height="900" fill="url(#bpGrid)"/>
</svg>