      <line x1="240" y1="444" x2="340" y2="444"/>
      <line x1="240" y1="486" x2="340" y2="486"/>
      <line x1="240" y1="528" x2="340" y2="528"/>
      <line x1="240" y1="570" x2="340" y2="570"/>
      <line x1="240" y1="612" x2="340" y2="612"/>
      <line x1="240" y1="654" x2="340" y2="654"/>
