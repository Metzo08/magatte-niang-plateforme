<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#060E18"/>
      <stop offset="42%" stop-color="#0B1B2B"/>
      <stop offset="74%" stop-color="#1B4965"/>
      <stop offset="100%" stop-color="#7A3E20"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F58A45" stop-opacity="0.85"/>
      <stop offset="38%" stop-color="#F26A1B" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#F26A1B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0F2436"/>
      <stop offset="100%" stop-color="#04090F"/>
    </linearGradient>
    <pattern id="lattice" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M0 0L36 36M36 0L0 36" stroke="#0A1622" stroke-width="3.5" fill="none"/>
      <rect width="36" height="36" fill="none" stroke="#0A1622" stroke-width="3.5"/>
    </pattern>
    <pattern id="deckHatch" width="14" height="14" patternUnits="userSpaceOnUse">
      <path d="M0 14L14 0" stroke="#2D6A8E" stroke-width="2" opacity="0.45"/>
    </pattern>
    <pattern id="bpGrid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#5FA8D3" stroke-width="1" opacity="0.05"/>
    </pattern>
    <radialGradient id="beaconGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F26A1B" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#F26A1B" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- Étoiles -->
  <g fill="#9FC1D9">
    <circle cx="90" cy="80" r="1.5" opacity="0.8"/>
    <circle cx="210" cy="140" r="1.2" opacity="0.6"/>
    <circle cx="340" cy="60" r="1.8" opacity="0.85"/>
    <circle cx="480" cy="110" r="1.3" opacity="0.6"/>
    <circle cx="620" cy="70" r="1.5" opacity="0.75"/>
    <circle cx="760" cy="130" r="1.2" opacity="0.55"/>
    <circle cx="900" cy="60" r="1.7" opacity="0.8"/>
    <circle cx="1040" cy="100" r="1.3" opacity="0.6"/>
    <circle cx="1180" cy="50" r="1.5" opacity="0.75"/>
    <circle cx="1320" cy="120" r="1.8" opacity="0.85"/>
    <circle cx="1460" cy="80" r="1.3" opacity="0.6"/>
    <circle cx="1540" cy="160" r="1.5" opacity="0.7"/>
    <circle cx="400" cy="180" r="1.1" opacity="0.5"/>
    <circle cx="980" cy="170" r="1.2" opacity="0.55"/>
    <circle cx="130" cy="200" r="1.3" opacity="0.6"/>
  </g>

  <!-- Soleil couchant -->
  <circle cx="1230" cy="700" r="430" fill="url(#sunGlow)"/>
  <circle cx="1230" cy="700" r="58" fill="#F9B685" opacity="0.8"/>

  <!-- Skyline arrière-plan -->
  <g fill="#0F2436" opacity="0.9">
    <rect x="0" y="590" width="120" height="110"/>
    <rect x="140" y="540" width="80" height="160"/>
    <rect x="240" y="610" width="100" height="90"/>
    <rect x="360" y="560" width="70" height="140"/>
    <rect x="450" y="620" width="110" height="80"/>
    <rect x="1180" y="600" width="90" height="100"/>
    <rect x="1290" y="560" width="70" height="140"/>
    <rect x="1380" y="620" width="100" height="80"/>
    <rect x="1500" y="580" width="100" height="120"/>
