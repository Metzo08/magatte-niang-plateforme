      <line x1="430" y1="470" x2="430" y2="700"/>
      <line x1="500" y1="470" x2="500" y2="700"/>
      <line x1="570" y1="470" x2="570" y2="700"/>
    </g>
    <g stroke="#16354D" stroke-width="5">
