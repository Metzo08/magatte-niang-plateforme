    <rect x="1108" y="200" width="24" height="8" fill="#0A1622"/>
    <line x1="1120" y1="208" x2="1120" y2="470" stroke="#0A1622" stroke-width="2"/>
    <rect x="1116" y="470" width="8" height="12" fill="#0A1622"/>
    <line x1="1120" y1="482" x2="1075" y2="505" stroke="#0A1622" stroke-width="2"/>
    <line x1="1120" y1="482" x2="1165" y2="505" stroke="#0A1622" stroke-width="2"/>
    <rect x="1050" y="505" width="140" height="11" fill="#1B4965"/>
    <rect x="1050" y="505" width="8" height="11" fill="#F58A45"/>
    <rect x="1182" y="505" width="8" height="11" fill="#F58A45"/>
  </g>

  <!-- Grue secondaire (arrière-plan) -->
  <g opacity="0.82">
    <rect x="1377" y="340" width="16" height="360" fill="url(#lattice)"/>
    <rect x="1090" y="336" width="287" height="14" fill="url(#lattice)"/>
    <path d="M1377 340 L1385 285 L1393 340 Z" fill="#0A1622"/>
    <line x1="1385" y1="288" x2="1200" y2="338" stroke="#0A1622" stroke-width="2"/>
    <rect x="1393" y="338" width="70" height="10" fill="url(#lattice)"/>
    <circle cx="1385" cy="282" r="3" fill="#F26A1B"/>
  </g>

