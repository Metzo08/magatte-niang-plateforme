      <line x1="364" y1="428" x2="364" y2="416"/>
      <line x1="426" y1="428" x2="426" y2="416"/>
      <line x1="434" y1="428" x2="434" y2="416"/>
      <line x1="496" y1="428" x2="496" y2="416"/>
      <line x1="504" y1="428" x2="504" y2="416"/>
      <line x1="566" y1="428" x2="566" y2="416"/>
      <line x1="574" y1="428" x2="574" y2="416"/>
    </g>
    <line x1="360" y1="470" x2="570" y2="470" stroke="#F58A45" stroke-width="2.5" opacity="0.85"/>
