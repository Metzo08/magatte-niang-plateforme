<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="acadBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#060E18"/>
      <stop offset="55%" stop-color="#0B1B2B"/>
      <stop offset="100%" stop-color="#132C42"/>
    </linearGradient>
    <radialGradient id="acadGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C8A24A" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#C8A24A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bookCover" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C8A24A"/>
      <stop offset="100%" stop-color="#8A6A2A"/>
    </linearGradient>
    <pattern id="acadGrid" width="52" height="52" patternUnits="userSpaceOnUse">
      <path d="M52 0H0V52" fill="none" stroke="#5FA8D3" stroke-width="1" opacity="0.06"/>
    </pattern>
  </defs>

  <rect width="1200" height="800" fill="url(#acadBg)"/>
  <rect width="1200" height="800" fill="url(#acadGrid)"/>
  <circle cx="600" cy="400" r="380" fill="url(#acadGlow)"/>

  <!-- Réseau moléculaire (microstructure béton / réseau de connaissances) -->
  <g stroke="#5FA8D3" stroke-width="2" opacity="0.75">
    <line x1="420" y1="240" x2="530" y2="180"/>
    <line x1="530" y1="180" x2="650" y2="220"/>
    <line x1="650" y1="220" x2="760" y2="160"/>
    <line x1="530" y1="180" x2="560" y2="300"/>
    <line x1="650" y1="220" x2="620" y2="330"/>
    <line x1="560" y1="300" x2="620" y2="330"/>
    <line x1="620" y1="330" x2="730" y2="290"/>
    <line x1="730" y1="290" x2="760" y2="160"/>
    <line x1="560" y1="300" x2="480" y2="380"/>
    <line x1="620" y1="330" x2="680" y2="400"/>
    <line x1="480" y1="380" x2="600" y2="430"/>
    <line x1="600" y1="430" x2="680" y2="400"/>
  </g>
  <g>
    <circle cx="420" cy="240" r="9" fill="#5FA8D3"/>
    <circle cx="530" cy="180" r="11" fill="#C8A24A"/>
    <circle cx="650" cy="220" r="9" fill="#5FA8D3"/>
    <circle cx="760" cy="160" r="8" fill="#D9C285"/>
    <circle cx="560" cy="300" r="10" fill="#F26A1B"/>
    <circle cx="620" cy="330" r="8" fill="#5FA8D3"/>
    <circle cx="730" cy="290" r="9" fill="#C8A24A"/>
    <circle cx="480" cy="380" r="8" fill="#D9C285"/>
    <circle cx="600" cy="430" r="10" fill="#5FA8D3"/>
    <circle cx="680" cy="400" r="7" fill="#F26A1B"/>
  </g>

  <!-- Silhouettes de bâtiments issues du réseau (savoir → réalisation) -->
  <g fill="#1B4965" opacity="0.85">
    <rect x="300" y="90" width="50" height="110"/>
    <rect x="370" y="60" width="44" height="140"/>
    <rect x="790" y="80" width="46" height="120"/>
    <rect x="850" y="50" width="54" height="150"/>
  </g>
  <g fill="#5FA8D3" opacity="0.35">
    <rect x="308" y="100" width="8" height="10"/>
    <rect x="324" y="120" width="8" height="10"/>
    <rect x="380" y="76" width="8" height="10"/>
    <rect x="396" y="96" width="8" height="10"/>
    <rect x="800" y="94" width="8" height="10"/>
    <rect x="816" y="114" width="8" height="10"/>
    <rect x="862" y="66" width="8" height="10"/>
    <rect x="878" y="86" width="8" height="10"/>
  </g>

  <!-- Livre ouvert central -->
  <g>
    <!-- Couverture -->
    <path d="M600 620 L380 560 L380 585 L600 645 Z" fill="#8A6A2A"/>
    <path d="M600 620 L820 560 L820 585 L600 645 Z" fill="#6B4F1D"/>
    <!-- Pages gauche -->
    <path d="M600 600 L390 545 L390 340 Q480 310 600 355 Z" fill="#F2F5F8"/>
    <!-- Pages droite -->
    <path d="M600 600 L810 545 L810 340 Q720 310 600 355 Z" fill="#E4EEF6"/>
    <!-- Lignes de texte -->
    <g stroke="#55636F" stroke-width="4" opacity="0.65" stroke-linecap="round">
      <path d="M415 360 Q490 338 575 370" fill="none"/>
      <path d="M415 390 Q490 368 575 400" fill="none"/>
      <path d="M415 420 Q490 398 575 430" fill="none"/>
      <path d="M415 450 Q490 428 575 460" fill="none"/>
      <path d="M415 480 Q490 458 575 490" fill="none"/>
      <path d="M625 370 Q710 338 785 360" fill="none"/>
      <path d="M625 400 Q710 368 785 390" fill="none"/>
      <path d="M625 430 Q710 398 785 420" fill="none"/>
      <path d="M625 460 Q710 428 785 450" fill="none"/>
      <path d="M625 490 Q710 458 785 480" fill="none"/>
    </g>
    <!-- Surlignage doré -->
    <path d="M625 520 Q710 488 785 510" stroke="#C8A24A" stroke-width="6" fill="none" opacity="0.9"/>
    <!-- Tranche centrale -->
    <line x1="600" y1="355" x2="600" y2="600" stroke="#B8C4D0" stroke-width="3"/>
  </g>

  <!-- Formules scientifiques flottantes -->
  <g font-family="monospace" fill="#D9C285" opacity="0.85">
    <text x="240" y="300" font-size="26">f</text>
    <text x="252" y="308" font-size="16">c28</text>
    <text x="300" y="300" font-size="26">= 35 MPa</text>
    <text x="840" y="330" font-size="26">E</text>
    <text x="856" y="338" font-size="16">cm</text>
    <text x="890" y="330" font-size="26">= 34 GPa</text>
    <text x="200" y="500" font-size="22" opacity="0.7">σ ≤ f</text>
    <text x="258" y="508" font-size="14" opacity="0.7">yd</text>
    <text x="900" y="470" font-size="22" opacity="0.7">γ</text>
    <text x="914" y="478" font-size="14" opacity="0.7">c</text>
    <text x="930" y="470" font-size="22" opacity="0.7">= 1.5</text>
  </g>

  <!-- Atome décoratif -->
  <g transform="translate(240,180)">
    <ellipse cx="0" cy="0" rx="46" ry="17" fill="none" stroke="#5FA8D3" stroke-width="2.5" opacity="0.7"/>
    <ellipse cx="0" cy="0" rx="46" ry="17" fill="none" stroke="#5FA8D3" stroke-width="2.5" opacity="0.7" transform="rotate(60)"/>
    <ellipse cx="0" cy="0" rx="46" ry="17" fill="none" stroke="#5FA8D3" stroke-width="2.5" opacity="0.7" transform="rotate(120)"/>
    <circle cx="0" cy="0" r="7" fill="#F26A1B"/>
    <circle cx="42" cy="0" r="4" fill="#D9C285"/>
    <circle cx="-21" cy="36" r="4" fill="#D9C285"/>
  </g>

  <!-- Laurier académique -->
  <g transform="translate(960,560)" fill="#C8A24A" opacity="0.9">
    <path d="M0 40 Q30 10 70 6" stroke="#C8A24A" stroke-width="4" fill="none"/>
    <ellipse cx="12" cy="30" rx="12" ry="5" transform="rotate(-38 12 30)"/>
    <ellipse cx="32" cy="16" rx="12" ry="5" transform="rotate(-48 32 16)"/>
    <ellipse cx="54" cy="8" rx="12" ry="5" transform="rotate(-58 54 8)"/>
  </g>

  <!--rayons de lumière -->
  <g fill="#F9B685" opacity="0.07">
    <path d="M600 380 L200 800 L340 800 Z"/>
    <path d="M600 380 L860 800 L1000 800 Z"/>
  </g>
</svg>