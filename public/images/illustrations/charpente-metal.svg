<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B1B2B"/>
      <stop offset="60%" stop-color="#132C42"/>
      <stop offset="100%" stop-color="#060E18"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5FA8D3"/>
      <stop offset="50%" stop-color="#2D6A8E"/>
      <stop offset="100%" stop-color="#1B4965"/>
    </linearGradient>
    <linearGradient id="steelLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9FC1D9"/>
      <stop offset="100%" stop-color="#5FA8D3"/>
    </linearGradient>
    <radialGradient id="glowOrange" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F26A1B" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#F26A1B" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#bg)"/>

  <!-- Halo de soudure -->
  <circle cx="830" cy="430" r="300" fill="url(#glowOrange)"/>

  <!-- Portique principal en acier -->
  <g>
    <rect x="150" y="120" width="20" height="480" fill="url(#steel)"/>
    <rect x="880" y="120" width="20" height="480" fill="url(#steel)"/>
    <path d="M150 120 h20 l-10 -36 Z" fill="#5FA8D3"/>
    <path d="M900 120 h-20 l10 -36 Z" fill="#5FA8D3"/>
    <rect x="150" y="128" width="750" height="16" fill="url(#steel)"/>
    <rect x="150" y="240" width="750" height="12" fill="url(#steel)" opacity="0.85"/>
    <rect x="150" y="360" width="750" height="12" fill="url(#steel)" opacity="0.7"/>
    <!-- Croix de Saint-André -->
    <g stroke="#2D6A8E" stroke-width="6" opacity="0.9">
      <line x1="170" y1="144" x2="870" y2="240"/>
      <line x1="870" y1="144" x2="170" y2="240"/>
      <line x1="170" y1="252" x2="870" y2="360"/>
      <line x1="870" y1="252" x2="170" y2="360"/>
    </g>
    <!-- Pannes et purlins -->
    <g stroke="#5FA8D3" stroke-width="3" opacity="0.6">
      <line x1="240" y1="144" x2="240" y2="240"/>
      <line x1="330" y1="144" x2="330" y2="240"/>
      <line x1="420" y1="144" x2="420" y2="240"/>
      <line x1="510" y1="144" x2="510" y2="240"/>
      <line x1="600" y1="144" x2="600" y2="240"/>
      <line x1="690" y1="144" x2="690" y2="240"/>
      <line x1="780" y1="144" x2="780" y2="240"/>
    </g>
    <!-- Rivets -->
    <g fill="#9FC1D9" opacity="0.85">
      <circle cx="160" cy="136" r="4"/><circle cx="300" cy="136" r="4"/><circle cx="450" cy="136" r="4"/><circle cx="600" cy="136" r="4"/><circle cx="750" cy="136" r="4"/><circle cx="860" cy="136" r="4"/>
      <circle cx="160" cy="246" r="3"/><circle cx="300" cy="246" r="3"/><circle cx="450" cy="246" r="3"/><circle cx="600" cy="246" r="3"/><circle cx="750" cy="246" r="3"/><circle cx="860" cy="246" r="3"/>
    </g>
  </g>

  <!-- Grue roulante / pont roulant -->
  <g>
    <line x1="150" y1="108" x2="870" y2="108" stroke="#9FC1D9" stroke-width="4"/>
    <rect x="640" y="96" width="150" height="24" fill="#1B4965" stroke="#5FA8D3" stroke-width="2"/>
    <rect x="700" y="120" width="6" height="150" stroke="#9FC1D9" stroke-width="2" fill="#132C42"/>
    <line x1="703" y1="270" x2="670" y2="300" stroke="#9FC1D9" stroke-width="3"/>
    <line x1="703" y1="270" x2="736" y2="300" stroke="#9FC1D9" stroke-width="3"/>
    <rect x="650" y="300" width="106" height="16" fill="#F26A1B" opacity="0.9"/>
    <rect x="650" y="300" width="106" height="16" fill="url(#steel)" opacity="0.35"/>
  </g>

  <!-- Soudure avec étincelles -->
  <g>
    <circle cx="830" cy="430" r="6" fill="#FFF6ED"/>
    <circle cx="830" cy="430" r="14" fill="#F9B685" opacity="0.9"/>
    <circle cx="830" cy="430" r="26" fill="#F58A45" opacity="0.5"/>
    <g stroke="#F9B685" stroke-width="3" stroke-linecap="round">
      <line x1="830" y1="400" x2="830" y2="410"/>
      <line x1="830" y1="450" x2="830" y2="460"/>
      <line x1="800" y1="430" x2="810" y2="430"/>
      <line x1="850" y1="430" x2="860" y2="430"/>
      <line x1="810" y1="410" x2="817" y2="417"/>
      <line x1="843" y1="443" x2="850" y2="450"/>
      <line x1="810" y1="450" x2="817" y2="443"/>
      <line x1="843" y1="417" x2="850" y2="410"/>
    </g>
  </g>

  <!-- Soudeur (silhouette) -->
  <g fill="#04090F">
    <circle cx="878" cy="392" r="12"/>
    <path d="M864 406 h28 l8 42 h-44 Z"/>
    <path d="M864 448 l-6 46 h12 l6 -30 Z"/>
    <path d="M892 448 l6 46 h-12 l-6 -30 Z"/>
  </g>
  <circle cx="878" cy="392" r="14" fill="none" stroke="#F58A45" stroke-width="3" opacity="0.55"/>

  <!-- Poutrelles en stock -->
  <g>
    <rect x="60" y="660" width="360" height="12" fill="#1B4965"/>
    <rect x="80" y="680" width="330" height="12" fill="#1B4965" opacity="0.85"/>
    <rect x="100" y="700" width="300" height="12" fill="#1B4965" opacity="0.7"/>
    <rect x="60" y="660" width="8" height="12" fill="#F58A45" opacity="0.6"/>
    <rect x="412" y="660" width="8" height="12" fill="#F58A45" opacity="0.6"/>
  </g>

  <!-- Sol -->
  <rect x="0" y="712" width="1200" height="88" fill="#04090F"/>
  <line x1="0" y1="712" x2="1200" y2="712" stroke="#5FA8D3" stroke-width="1.5" opacity="0.2"/>

  <!-- Cotes techniques -->
  <g stroke="#5FA8D3" stroke-width="1.5" opacity="0.5" fill="none">
    <line x1="150" y1="640" x2="900" y2="640"/>
    <line x1="150" y1="632" x2="150" y2="648"/>
    <line x1="900" y1="632" x2="900" y2="648"/>
    <text x="500" y="630" fill="#5FA8D3" font-family="monospace" font-size="18">L = 24.00 m</text>
  </g>
</svg>