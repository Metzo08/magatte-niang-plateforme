<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Fond dégradé -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F26A1B"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="helmet" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>

  <circle cx="100" cy="100" r="100" fill="url(#bg)"/>

  <!-- Corps / veste de chantier -->
  <path d="M 45 200 Q 45 145 100 145 Q 155 145 155 200 Z" fill="#2D5A27"/>
  <!-- Bande réfléchissante -->
  <rect x="55" y="175" width="90" height="10" rx="5" fill="#FCD34D" opacity="0.9"/>

  <!-- Cou -->
  <rect x="86" y="130" width="28" height="22" rx="10" fill="#D9A066"/>

  <!-- Tête -->
  <ellipse cx="100" cy="105" rx="36" ry="40" fill="#E8B88A"/>

  <!-- Oreilles -->
  <ellipse cx="64" cy="110" rx="6" ry="9" fill="#D9A066"/>
  <ellipse cx="136" cy="110" rx="6" ry="9" fill="#D9A066"/>

  <!-- Yeux -->
  <circle cx="86" cy="108" r="5" fill="#1F2937"/>
  <circle cx="114" cy="108" r="5" fill="#1F2937"/>
  <circle cx="88" cy="106" r="1.5" fill="#FFFFFF"/>
  <circle cx="116" cy="106" r="1.5" fill="#FFFFFF"/>

  <!-- Sourire -->
  <path d="M 86 126 Q 100 136 114 126" stroke="#8B5A2B" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Casque de chantier -->
  <path d="M 58 90 Q 58 52 100 52 Q 142 52 142 90 Z" fill="url(#helmet)"/>
  <ellipse cx="100" cy="90" rx="52" ry="10" fill="#FBBF24"/>
  <!-- Liseré casque -->
  <path d="M 58 88 Q 100 80 142 88" stroke="#FDE68A" stroke-width="3" fill="none"/>
  <!-- Petite crête avant du casque -->
  <rect x="94" y="46" width="12" height="12" rx="4" fill="#FBBF24"/>

  <!-- Petite brique dans la main (symbole maçon) -->
  <g transform="translate(140,155)">
    <rect x="0" y="0" width="26" height="14" rx="2" fill="#C0562F"/>
    <rect x="0" y="0" width="26" height="5" rx="2" fill="#DD6B20"/>
  </g>
</svg>
